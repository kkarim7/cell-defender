    <!-- Search results: keep the title under ~60 chars and the description under ~160 -->
    <title>Cell Defender – White Blood Cell Arcade Game</title>
    <meta name="description" content="Play free in your browser as a white blood cell fighting bacteria, viruses and parasites. 3D arcade action with power-ups and bosses on desktop and mobile." />

    <meta property="og:site_name" content="Cell Defender" />
    <meta property="og:title" content="Cell Defender – White Blood Cell Arcade Game" />
    <meta property="og:description" content="You are a white blood cell. Engulf bacteria, dash through viruses, blast parasites and beat the bosses. Free 3D arcade game in your browser." />
    <meta property="og:image:width" content="1200" />

    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />

  <body>
    <div id="root"></div>
    <noscript>
      <h1>Cell Defender – White Blood Cell Arcade Game</h1>
      <p>
        You are a white blood cell defending the body. Engulf bacteria before they multiply, dash through viruses,
        shoot parasites that are too big to eat, collect power-ups like tentacle whips and homing antibodies, and defeat
        bosses every few waves. Cell Defender is a free 3D arcade game that runs in your browser on desktop and mobile.
      </p>
